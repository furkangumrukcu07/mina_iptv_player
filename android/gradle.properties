org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# ─── R8 / Resource Shrinking Optimizasyonu ───────────────────────────────────
# AGP 9.0'da default olarak gelen "Optimized Resource Shrinking" algoritmasını
# AGP 8.x'te experimental olarak aktive eder. Play Console bu flag'e bakarak
# "optimize edilmiş kaynak kaldırma etkin değil" uyarısını kaldırır.
android.enableNewResourceShrinker=true

# Daha hassas kaynak analizi: hangi kaynakların gerçekten kullanıldığını
# daha doğru saptar (false positive'leri azaltır, APK daha da küçülür).
android.experimental.enableNewResourceShrinker.precision=true

# R8 Full Mode: Kotlin/Java bağımlılıklarında daha agresif sınıf birleştirme, satır içi metot (inlining)
# ve optimizasyon uygulayarak bellek baskısını azaltır ve APK boyutunu daha da düşürür.
android.enableR8.fullMode=true


# ─── Gradle Build Performansı ────────────────────────────────────────────────
# Build cache — temiz derleme sonrası artifact'lar önbelleğe alınır.
org.gradle.caching=true

# Paralel proje derleme (bağımsız modüller eş zamanlı).
org.gradle.parallel=true

# Konfigürasyon önbelleği — Gradle konfigürasyon aşamasını tekrar hesaplamaz.
# Not: bazı Flutter plugin'leri bunu desteklemeyebilir; sorun olursa kaldırın.
# org.gradle.configuration-cache=true
