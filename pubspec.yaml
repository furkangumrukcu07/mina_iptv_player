name: mina_iptv_player
description: Mina IPTV Player — Android TV optimized IPTV client with GetX.
publish_to: none
version: 2.17.74+4548

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  vector_math: ^2.1.4
  google_fonts: ^6.2.1
  get: ^4.6.6
  dio: ^5.7.0
  collection: ^1.19.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  better_player_plus:
    path: packages/better_player_plus
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  wakelock_plus: ^1.5.1
  xml: ^6.6.1
  intl: ^0.20.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  # Sürüm + installerStore (yükleyici paketi) — AppInstallSourceService
  package_info_plus: ^9.0.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image: ^4.5.4
  # Upstream 0.0.2: IntegrityErrorCode.NO_NETWORK → NETWORK_ERROR uyumsuzluğu; yerel yama (packages/).
  flutter_play_integrity_wrapper:
    path: packages/flutter_play_integrity_wrapper
  flutter_volume_controller: ^1.0.4
  translator: ^1.0.4+1
  sentry_flutter: ^8.14.2
  device_info_plus: ^12.4.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  archive: ^4.0.9
  connectivity_plus: ^7.1.1
  encrypt: ^5.0.3
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  network_info_plus: ^7.0.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.0.0
  google_sign_in: ^7.2.0
  firebase_remote_config: ^6.5.2
  firebase_analytics: ^12.4.2
  battery_plus: ^7.0.0
  firebase_messaging: ^16.3.0
  google_api_availability: ^5.0.1
  workmanager: ^0.9.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/2x/
    - assets/images/3x/

# Uygulama ikonunu değiştirmek için: `assets/images/app_icon.png` dosyasını yeni PNG ile değiştir,
# sonra: `dart run flutter_launcher_icons`
# Android: `dart run flutter_launcher_icons` sonrası mobil ic_launcher.xml içindeki foreground
# inset’i tekrar ~27% yap (TV: res/mipmap-television-anydpi-v26/ic_launcher.xml).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/images/new_logo.png
  android: true
  ios: true
